<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>赛博梦占 · 梦境塔罗恋人</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 背景蕾丝装饰 -->
  <div class="bg-lace bg-lace-top" aria-hidden="true">
    <svg width="100%" height="40" preserveAspectRatio="none">
      <defs>
        <pattern id="laceTop" width="36" height="40" patternUnits="userSpaceOnUse">
          <path d="M0 10 Q18 34 36 10" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"></path>
          <circle cx="18" cy="30" r="2.2" fill="rgba(255,255,255,0.65)"></circle>
          <circle cx="0" cy="8" r="1.6" fill="rgba(255,255,255,0.5)"></circle>
          <circle cx="36" cy="8" r="1.6" fill="rgba(255,255,255,0.5)"></circle>
        </pattern>
      </defs>
      <rect width="100%" height="40" fill="url(#laceTop)"></rect>
    </svg>
  </div>
  <div class="bg-lace bg-lace-bottom" aria-hidden="true">
    <svg width="100%" height="40" preserveAspectRatio="none">
      <defs>
        <pattern id="laceBottom" width="36" height="40" patternUnits="userSpaceOnUse">
          <path d="M0 30 Q18 6 36 30" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"></path>
          <circle cx="18" cy="10" r="2.2" fill="rgba(255,255,255,0.65)"></circle>
        </pattern>
      </defs>
      <rect width="100%" height="40" fill="url(#laceBottom)"></rect>
    </svg>
  </div>

  <!-- 页面一：链接失效 -->
  <section id="screen-invalid" class="screen center-screen">
    <div class="card invalid-card">
      <div class="invalid-icon">💔</div>
      <h2 class="card-title">链接不存在或已失效</h2>
      <p id="invalid-tip" class="card-sub">请确认链接是否完整，或联系分享者获取新链接。</p>
    </div>
  </section>

  <!-- 页面二：密码验证 -->
  <section id="screen-password" class="screen center-screen">
    <div class="card auth-card" id="pwd-card">
      <h1 class="brand">赛博梦占</h1>
      <p class="card-sub">这个梦境被上了锁，请输入密码进入</p>
      <div class="form-group">
        <input id="pwd-input" type="password" class="input" placeholder="请输入密码" maxlength="64" autocomplete="off">
      </div>
      <p id="pwd-error" class="error-text"></p>
      <button id="pwd-btn" class="btn-primary btn-block">解锁梦境</button>
    </div>
  </section>

  <!-- 页面三：设置 -->
  <section id="screen-setup" class="screen center-screen scrollable">
    <div class="card setup-card">
      <h1 class="brand">赛博梦占</h1>
      <p class="card-sub">在梦开始之前，先告诉我你们的故事</p>

      <div class="section-label">关于你</div>

      <div class="form-group">
        <label class="form-label" for="f-user-name">用户昵称 <span class="req">*</span></label>
        <input id="f-user-name" class="input" type="text" placeholder="你的名字或昵称" maxlength="20">
      </div>

      <div class="form-group">
        <label class="form-label" for="f-user-gender">用户性别</label>
        <select id="f-user-gender" class="input">
          <option value="女">女</option>
          <option value="男">男</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="section-label">关于 TA</div>

      <div class="form-group">
        <label class="form-label" for="f-lover-name">另一半昵称 <span class="req">*</span></label>
        <input id="f-lover-name" class="input" type="text" placeholder="mj姓名" maxlength="20">
      </div>

      <div class="form-group">
        <label class="form-label" for="f-lover-gender">另一半性别</label>
        <select id="f-lover-gender" class="input">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="f-personality">性格特质 / 说话风格 <span class="req">*</span></label>
        <textarea id="f-personality" class="input textarea" rows="4" maxlength="500" placeholder="自由描述 TA 的性格，例如：温柔粘人，偶尔吃醋，喜欢撒娇"></textarea>
        <p class="form-hint">越具体，TA 就越像你心里的那个人</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="f-stage">和你的关系阶段</label>
        <select id="f-stage" class="input">
          <option value="暧昧中">暧昧中</option>
          <option value="刚确定关系">刚确定关系</option>
          <option value="热恋中">热恋中</option>
          <option value="老夫老妻">老夫老妻</option>
        </select>
      </div>

      <p id="setup-error" class="error-text"></p>
      <button id="setup-btn" class="btn-primary btn-block">开始我们的对话 ♡</button>
    </div>
  </section>

  <!-- 页面四：聊天 -->
  <section id="screen-chat" class="screen chat-screen">

    <!-- 顶部 -->
    <header class="chat-header">
      <div class="chat-header-left">
        <div id="chat-avatar" class="avatar"></div>
        <div class="chat-header-info">
          <div id="chat-name" class="chat-name">恋人</div>
          <div id="chat-stage" class="chat-stage">热恋中</div>
        </div>
      </div>
      <div id="chat-remaining" class="remaining-badge">剩余 -- 次</div>
    </header>

    <!-- 消息列表 -->
    <main id="chat-messages" class="chat-messages">
      <div id="chat-welcome" class="chat-welcome">
        <div class="chat-welcome-heart">✦</div>
        <p>梦境已连接，和 TA 说第一句话吧</p>
      </div>
    </main>

    <!-- 输入区 -->
    <footer class="chat-input-bar">
      <input id="chat-input" class="chat-input" type="text" placeholder="输入消息…" maxlength="2000" autocomplete="off">
      <button id="chat-send" class="chat-send" aria-label="发送">➤</button>
    </footer>

    <div id="chat-exhausted" class="exhausted-banner" hidden>链接已失效，感谢你们的这场梦 ✧</div>

    <!-- 历史记录按钮 -->
    <button id="history-fab" class="history-fab" aria-label="塔罗历史">
      <span class="fab-icon">🃏</span>
      <span class="fab-text">牌历</span>
    </button>

    <!-- 历史抽屉 -->
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="history-drawer" class="history-drawer">
      <div class="drawer-head">
        <h3>🃏 塔罗牌抽取历史</h3>
        <button id="drawer-close" class="drawer-close" aria-label="关闭">✕</button>
      </div>
      <div id="drawer-list" class="drawer-list">
        <p class="drawer-empty">还没有抽过牌，发一条消息试试吧</p>
      </div>
    </aside>

    <!-- 塔罗牌浮层 -->
    <div id="tarot-overlay" class="tarot-overlay" hidden>
      <div class="tarot-stage">
        <div class="tarot-title">正在为你抽取塔罗牌…</div>
        <div class="tarot-cards">
          <div class="tcard" data-index="0">
            <div class="tcard-inner">
              <div class="tface tface-back">
                <div class="tback-pattern">✦ ✧ ✦</div>
              </div>
              <div class="tface tface-front">
                <div class="tcard-position"></div>
                <div class="tcard-name"></div>
                <div class="tcard-orientation"></div>
                <div class="tcard-keywords"></div>
              </div>
            </div>
          </div>
          <div class="tcard" data-index="1">
            <div class="tcard-inner">
              <div class="tface tface-back">
                <div class="tback-pattern">✦ ✧ ✦</div>
              </div>
              <div class="tface tface-front">
                <div class="tcard-position"></div>
                <div class="tcard-name"></div>
                <div class="tcard-orientation"></div>
                <div class="tcard-keywords"></div>
              </div>
            </div>
          </div>
          <div class="tcard" data-index="2">
            <div class="tcard-inner">
              <div class="tface tface-back">
                <div class="tback-pattern">✦ ✧ ✦</div>
              </div>
              <div class="tface tface-front">
                <div class="tcard-position"></div>
                <div class="tcard-name"></div>
                <div class="tcard-orientation"></div>
                <div class="tcard-keywords"></div>
              </div>
            </div>
          </div>
        </div>
        <button id="tarot-skip" class="tarot-skip">点击跳过</button>
      </div>
    </div>

  </section>

  <!-- 全局提示 -->
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
